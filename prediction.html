<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>予想結果 | 競艇予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2436;
    --navy-soft:#16324A;
    --paper:#EEF1EF;
    --card:#FFFFFF;
    --line:#D8DEDC;
    --ink:#16232B;
    --ink-soft:#5B6B72;
    --accent:#16786B;
    --accent-soft:#E4F1EE;
    --lane1:#FFFFFF; --lane1-line:#26313A;
    --lane2:#1A1A1A;
    --lane3:#D2352C;
    --lane4:#1D63B4;
    --lane5:#F2B705;
    --lane6:#2E8B4E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
    padding-bottom:44px;
  }

  .appbar{
    background:var(--navy);
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky; top:0; z-index:10;
  }
  .back{
    font-size:22px;
    color:#CBD9DE;
    line-height:1;
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .appbar-title{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    font-weight:700;
  }
  .star-tag{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:10px;
    font-weight:700;
    padding:2px 6px;
    border-radius:4px;
    background:#FFF3D6;
    color:#8A6100;
    vertical-align:middle;
    margin-left:2px;
    border:none;
    -webkit-tap-highlight-color:transparent;
  }
  .appbar-sub{
    font-size:12px;
    color:#8FA6B2;
    margin-top:2px;
  }

  .confidence-detail{
    display:none;
    margin:0 16px 0;
    padding:10px 14px;
    background:#FFF9EC;
    border:1px solid #F0DFA6;
    border-radius:8px;
    font-size:11.5px;
    color:#6B5410;
    line-height:1.7;
  }
  .confidence-detail.open{
    display:block;
    margin-top:14px;
  }

  .section{
    padding:18px 16px 4px;
  }
  .section-label{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
    margin-bottom:10px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .section-label .note{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:500;
  }

  /* ---- 予想ランキング ---- */
  .rank-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .rank-row{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    display:flex;
    align-items:center;
    gap:12px;
  }
  .rank-row.top{
    border-color:var(--accent);
    box-shadow:0 0 0 1px var(--accent);
    background:var(--accent-soft);
  }
  .mark{
    font-family:'Shippori Mincho', serif;
    font-size:24px;
    font-weight:700;
    color:var(--navy);
    width:30px;
    text-align:center;
    flex:0 0 auto;
  }
  .rank-row.top .mark{ color:var(--accent); }

  .lane-badge{
    width:28px; height:28px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700;
    flex:0 0 auto;
  }
  .lane-badge.l1{ background:var(--lane1); color:#16232B; border:1.5px solid var(--lane1-line); }
  .lane-badge.l2{ background:var(--lane2); color:#fff; }
  .lane-badge.l3{ background:var(--lane3); color:#fff; }
  .lane-badge.l4{ background:var(--lane4); color:#fff; }
  .lane-badge.l5{ background:var(--lane5); color:#3A2E00; }
  .lane-badge.l6{ background:var(--lane6); color:#fff; }

  .rank-body{
    flex:1 1 auto;
    min-width:0;
  }
  .rank-name{
    font-size:14.5px;
    font-weight:700;
    margin-bottom:4px;
  }
  .risk-tag{
    font-size:10px;
    font-weight:700;
    color:#B3261E;
    background:#FCE8E6;
    padding:1px 5px;
    border-radius:4px;
    margin-left:2px;
  }
  .class-tag{
    font-size:10px;
    font-weight:700;
    color:#16324A;
    background:#E4E8EC;
    padding:1px 5px;
    border-radius:4px;
    margin-left:2px;
  }
  .rank-bar-track{
    height:5px;
    background:#E4E8E7;
    border-radius:3px;
    overflow:hidden;
  }
  .rank-bar-fill{
    height:100%;

    border-radius:3px;
  }
  .rank-row.top .rank-bar-fill{ background:var(--accent); }

  .rank-pct{
    font-size:17px;
    font-weight:900;
    color:var(--navy);
    width:48px;
    text-align:right;
    flex:0 0 auto;
  }

    flex-direction:column;
    gap:7px;

  .bet-row{

    border:1px solid var(--line);
    border-radius:8px;
    padding:11px 14px;

    flex-wrap:wrap;
    align-items:center;
    justify-content:space-between;
    gap:8px;

  .bet-buy-btn{

    font-size:11px;
    font-weight:700;

    border-radius:14px;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink-soft);
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
    white-space:nowrap;

    border:1px solid var(--line);
    border-radius:6px;
    text-align:right;
    font-family:inherit;
    -moz-appearance:textfield;

  .mybets-summary{

    border-radius:8px;

    font-weight:700;
    text-decoration:none;
  }
  .bet-combo{
    font-family:'Shippori Mincho', serif;
    font-size:18px;
    font-weight:700;

  .bet-meta{
    text-align:right;
  }
  .bet-prob{
    font-size:13px;
    font-weight:700;
    color:var(--accent);
  }
  .bet-odds{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:1px;

  /* ---- 根拠データ ---- */
  .data-table{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .data-row{
    display:grid;
    grid-template-columns:34px 1fr 50px 50px 50px 56px;
    align-items:center;
    padding:10px 12px;
    gap:6px;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .data-row:last-child{ border-bottom:none; }
  .data-row.head{
    background:#F5F7F6;
    color:var(--ink-soft);
    font-weight:700;
    font-size:10.5px;
  }
  .data-row .lane-badge{
    width:22px; height:22px;
    font-size:11px;
  }
  .data-name{
    font-weight:700;
    font-size:12.5px;
  }
  .data-num{
    text-align:right;
    font-weight:500;
    color:var(--ink);

  .loading-note{
    padding:24px 14px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;

  .disclaimer{
    margin:20px 16px 0;
    padding:12px 14px;
    background:#FFF6E0;
    border:1px solid #F0DFA6;
    border-radius:8px;
    font-size:11.5px;
    color:#6B5410;
    line-height:1.7;
  }

<script>
// ---- サンプルデータ(実データが取得できない場合のフォールバック) ----
// 外部データ(APIから取得した文字列)をHTMLに埋め込む前に必ずエスケープする(XSS対策)
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const MOCK_RANK = [
  {mark:"◎", lane:1, name:"田中 一輝", pct:34, exh:"6.72", natWin:"6.21", localWin:"6.80", motor2r:38.5, class:"A1"},
  {mark:"○", lane:4, name:"佐藤 直人", pct:24, exh:"6.75", natWin:"5.44", localWin:"5.10", motor2r:35.2, class:"A1"},
  {mark:"▲", lane:2, name:"鈴木 亮太", pct:17, exh:"6.78", natWin:"5.02", localWin:"4.85", motor2r:33.0, class:"A2"},
  {mark:"△", lane:3, name:"高橋 誠",   pct:13, exh:"6.80", natWin:"4.71", localWin:"4.50", motor2r:31.8, class:"A2"},
  {mark:"×", lane:6, name:"伊藤 大輔", pct:7,  exh:"6.83", natWin:"4.30", localWin:"4.02", motor2r:29.4, class:"B1"},
  {mark:"注", lane:5, name:"渡辺 翔",  pct:5,  exh:"6.85", natWin:"3.95", localWin:"3.60", motor2r:27.1, class:"B1"},
];
const MOCK_BETS = [
  {combo:"1-4-2", prob:"9.8%"},
  {combo:"1-2-4", prob:"7.1%"},
  {combo:"1-4-3", prob:"5.9%"},
  {combo:"4-1-2", prob:"4.2%"},
];
const MOCK_EXACTA_BETS = [
  {combo:"1-4", prob:"18.2%"},
  {combo:"1-2", prob:"12.5%"},
];

let RANK = MOCK_RANK;
let BETS = MOCK_BETS;
let EXACTA_BETS = MOCK_EXACTA_BETS;
// それぞれ {isConfident, hitRate, sampleSize, bucket}
let CONFIDENCE = { win: null, bet: null, exacta: null };

const CONFIDENCE_LABELS = {
  win: "◎単勝",
  bet: "3連単",
  exacta: "2連単",
};
const CONFIDENCE_IDS = {
  win: { badge: "confidenceBadgeWin", panel: "confidenceDetailWin" },
  bet: { badge: "confidenceBadgeBet", panel: "confidenceDetailBet" },
  exacta: { badge: "confidenceBadgeExacta", panel: "confidenceDetailExacta" },
};

// 「自信あり」バッジの根拠(過去の的中率・サンプル数)をタップで開閉表示する
function toggleConfidenceDetail(kind){
  const ids = CONFIDENCE_IDS[kind];
  const panel = document.getElementById(ids.panel);
  const btn = document.getElementById(ids.badge);
  const isOpen = panel.classList.toggle("open");
  btn.setAttribute("aria-expanded", isOpen ? "true" : "false");
  if(isOpen){
    const c = CONFIDENCE[kind];
    panel.textContent = c && c.hitRate !== null && c.hitRate !== undefined
      ? `${CONFIDENCE_LABELS[kind]}のこの確信度の帯(${c.bucket ?? "-"})では、過去 ${c.sampleSize ?? 0}件中 ${Math.round((c.hitRate ?? 0) * 100)}% が的中しています。`
      : "根拠データがまだ十分に溜まっていません。";
  }
}

// URLの ?stadium=桐生&race=3 を読み取り、data/today.json から該当レースを探す
let CURRENT_RACE = { date: null, stadium: null, raceNumber: null }; // 購入記録のキーに使う

// update-data.yml のスケジュール(JST 7:00〜22:30の間、30分おき)に基づいて、
// 次回の自動更新予定時刻を計算する。デバイスの時計が日本時間である前提。
function computeNextUpdateTime(now){
  const startMinutes = 7 * 60;        // 07:00
  const endMinutes = 22 * 60 + 30;    // 22:30
  const nowMinutes = now.getHours() * 60 + now.getMinutes();

  let targetMinutes;
  let dayOffset = 0;
  if (nowMinutes < startMinutes){
    targetMinutes = startMinutes;
  }else if (nowMinutes >= endMinutes){
    targetMinutes = startMinutes;
    dayOffset = 1;
  }else{
    targetMinutes = Math.ceil((nowMinutes + 1) / 30) * 30;
    if (targetMinutes > endMinutes){
      targetMinutes = startMinutes;
      dayOffset = 1;
    }
  }
  const next = new Date(now);
  next.setDate(next.getDate() + dayOffset);
  next.setHours(Math.floor(targetMinutes / 60), targetMinutes % 60, 0, 0);
  return next;
}

function fmtHHMM(d){
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

// 締切までに次の自動更新が来るかどうかで「予想確定」/「暫定」を判定する
function renderPredictionStatus(race){
  const el = document.getElementById("predictionStatusLabel");
  if (!el) return;
  if (race.isFinished){
    el.textContent = ""; // レースが既に終わっている場合は予想確定/暫定の表示自体が無意味
    return;
  }
  if (!race.close){
    el.textContent = "";
    return;
  }
  const closeDate = new Date(race.close.replace(" ", "T"));
  if (isNaN(closeDate.getTime())){
    el.textContent = "";
    return;
  }
  const now = new Date();
  const nextUpdate = computeNextUpdateTime(now);
  // update-data.yml の実行自体に数分かかることや、GitHub Actionsのスケジュール実行が
  // 数分遅れることがあるため、10分のバッファを見て「更新が間に合うか」を判定する。
  const UPDATE_BUFFER_MINUTES = 10;
  const nextUpdateWithBuffer = new Date(nextUpdate.getTime() + UPDATE_BUFFER_MINUTES * 60000);
  if (nextUpdateWithBuffer >= closeDate){
    el.textContent = "✓ 予想確定(締切までに次の更新はありません)";
  }else{
    el.textContent = `暫定の予想です(次回更新 ${fmtHHMM(nextUpdate)} 予定・締切までに反映されます)`;
  }
}

async function loadRealData(){
  const params = new URLSearchParams(location.search);
  const stadiumParam = params.get("stadium");
  const raceParam = params.get("race") ? Number(params.get("race")) : null;

  let usingReal = false;
  try{
    const res = await fetch("./data/today.json", {cache:"no-store"});
    if(!res.ok) throw new Error("no data file");
    const json = await res.json();
    const st = json.stadiums.find(s => s.name === stadiumParam) || json.stadiums[0];
    const race = st.races.find(r => r.number === raceParam) || st.races[0];
    if(!race) throw new Error("race not found");

    CURRENT_RACE = { date: json.date || null, stadium: st.name, raceNumber: race.number };

    RANK = race.boats_ranked.map(b => ({
      mark: b.mark, lane: b.lane, name: b.name, pct: b.pct,
      exh: b.exh ?? "-", natWin: b.natWin ?? "-", localWin: b.localWin ?? "-",
      motor2r: b.motor2r ?? null, natPlace: b.natPlace ?? null, localPlace: b.localPlace ?? null,
      flying: b.flying ?? 0, late: b.late ?? 0, class: b.class ?? null
    }));
    BETS = race.bets;
    EXACTA_BETS = Array.isArray(race.exactaBets) ? race.exactaBets : [];
    document.getElementById("exactaSection").style.display = EXACTA_BETS.length ? "" : "none";
    CONFIDENCE = { win: race.confidence || null, bet: race.betConfidence || null, exacta: race.exactaConfidence || null };
    document.querySelector("#titleText").textContent = `${st.name} ${race.number}R 予想`;
    document.getElementById("confidenceBadgeWin").style.display =
      (CONFIDENCE.win && CONFIDENCE.win.isConfident) ? "inline" : "none";
    document.getElementById("confidenceBadgeBet").style.display =
      (CONFIDENCE.bet && CONFIDENCE.bet.isConfident) ? "inline" : "none";
    document.getElementById("confidenceBadgeExacta").style.display =
      (CONFIDENCE.exacta && CONFIDENCE.exacta.isConfident) ? "inline" : "none";
    document.querySelector(".appbar-sub").textContent =
      `締切 ${race.close || "--:--"}${race.grade ? " ・ " + race.grade : ""}` +
      (race.weather ? ` ・ ${race.weather}` : "") +
      (race.windSpeed != null ? ` ・ 風${race.windSpeed}m` : "") +
      (race.waveHeight != null ? ` ・ 波${race.waveHeight}cm` : "");
    renderPredictionStatus(race);
    usingReal = true;
  }catch(e){
    // stadium/raceパラメータがあればタイトルだけ反映してサンプルデータを使う
    if(stadiumParam){
      document.querySelector("#titleText").textContent =
        `${stadiumParam} ${raceParam || ""}R 予想`;
    }
    RANK = MOCK_RANK;
    BETS = MOCK_BETS;
    EXACTA_BETS = MOCK_EXACTA_BETS;
    document.getElementById("exactaSection").style.display = "";
    CONFIDENCE = { win: null, bet: null, exacta: null };
  }
  document.querySelector(".disclaimer").textContent = usingReal
    ? "実データに基づく予想です。舟券の購入は自己責任で、当たりを保証するものではありません。"
    : "表示している確率・買い目はサンプルデータによる仮の予想です。実際のモデル・データに接続すると本物の予測に置き換わります。舟券の購入は自己責任で、当たりを保証するものではありません。";

  renderRank();
  renderBets();
  renderExactaBets();
  renderData();
}

function renderRank(){
  const wrap = document.getElementById("rankList");
  wrap.innerHTML = RANK.map((r,i)=>`
    <div class="rank-row ${i===0?'top':''}">
      <div class="mark">${r.mark}</div>
      <div class="lane-badge l${r.lane}">${r.lane}</div>
      <div class="rank-body">
        <div class="rank-name">${escapeHtml(r.name)}${r.class ? ' <span class="class-tag">'+escapeHtml(r.class)+'</span>' : ''}${r.flying ? ' <span class="risk-tag">F'+r.flying+'</span>' : ''}${r.late ? ' <span class="risk-tag">L'+r.late+'</span>' : ''}</div>
        <div class="rank-bar-track"><div class="rank-bar-fill" style="width:${r.pct}%"></div></div>
      </div>
      <div class="rank-pct">${r.pct}%</div>
    </div>
  `).join("");
}

// ---- 購入記録(このブラウザのlocalStorageに保存。サーバーには送信しない) ----
const MYBETS_STORAGE_KEY = "kyotei_my_bets";

function loadMyBets(){
  try{
    const raw = localStorage.getItem(MYBETS_STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  }catch(e){
    return [];
  }
}

function saveMyBets(records){
  try{
    localStorage.setItem(MYBETS_STORAGE_KEY, JSON.stringify(records));
  }catch(e){
    // 保存領域が無い/満杯などの場合は諦める(購入記録は無くても他の機能に影響しない)
  }
}

function myBetRecordId(betType, combo){
  return `${CURRENT_RACE.date}_${CURRENT_RACE.stadium}_${CURRENT_RACE.raceNumber}_${betType}_${combo}`;
}

function findMyBet(betType, combo){
  const id = myBetRecordId(betType, combo);
  return loadMyBets().find(r => r.id === id) || null;
}

function toggleMyBet(betType, combo, prob){
  if (!CURRENT_RACE.date || !CURRENT_RACE.stadium){
    alert("レース情報が読み込めていないため、購入記録を保存できません。");
    return;
  }
  const id = myBetRecordId(betType, combo);
  const records = loadMyBets();
  const idx = records.findIndex(r => r.id === id);
  if (idx >= 0){
    records.splice(idx, 1); // 既に記録済みなら取り消す
  }else{
    const stakeInput = document.getElementById(`stake_${id}`);
    const stake = stakeInput ? (parseInt(stakeInput.value, 10) || 100) : 100;
    records.push({
      id, date: CURRENT_RACE.date, stadium: CURRENT_RACE.stadium,
      raceNumber: CURRENT_RACE.raceNumber, betType, combo, prob: prob || null,
      stake, recordedAt: new Date().toISOString(),
    });
  }
  saveMyBets(records);
  renderBets();
  renderExactaBets();
}

function updateMyBetStake(betType, combo){
  const id = myBetRecordId(betType, combo);
  const records = loadMyBets();
  const rec = records.find(r => r.id === id);
  if (!rec) return; // まだ購入登録していない場合は何もしない
  const stakeInput = document.getElementById(`stake_${id}`);
  rec.stake = stakeInput ? (parseInt(stakeInput.value, 10) || 100) : 100;
  saveMyBets(records);
}

function renderBetRow(b, betType){
  const id = myBetRecordId(betType, b.combo);
  const existing = findMyBet(betType, b.combo);
  const isBought = !!existing;
  const stakeVal = existing ? existing.stake : 100;
  return `
    <div class="bet-row ${isBought ? "bought" : ""}">
      <div class="bet-combo">${escapeHtml(b.combo)}</div>
      <div class="bet-meta">
        <div class="bet-prob">的中確率 ${escapeHtml(b.prob)}</div>
      </div>
      <div class="bet-buy-controls">
        <input type="number" inputmode="numeric" class="bet-stake-input" id="stake_${id}"
               value="${stakeVal}" min="100" step="100"
               onchange="updateMyBetStake('${betType}', '${b.combo}')">
        <button type="button" class="bet-buy-btn ${isBought ? "active" : ""}"
                onclick="toggleMyBet('${betType}', '${b.combo}', '${b.prob}')">
          ${isBought ? "✓ 購入済" : "購入した"}
        </button>
      </div>
    </div>
  `;
}

function renderBets(){
  const wrap = document.getElementById("betList");
  wrap.innerHTML = BETS.map(b => renderBetRow(b, "trifecta")).join("");
}

function renderExactaBets(){
  const wrap = document.getElementById("exactaBetList");
  wrap.innerHTML = EXACTA_BETS.map(b => renderBetRow(b, "exacta")).join("");
}

function renderData(){
  const wrap = document.getElementById("dataTable");
  const head = `
    <div class="data-row head">
      <div></div>
      <div>選手</div>
      <div class="data-num">展示</div>
      <div class="data-num">全国勝率</div>
      <div class="data-num">当地勝率</div>
      <div class="data-num">モーター2連率</div>
    </div>
  `;
  const rows = RANK.slice().sort((a,b)=>a.lane-b.lane).map(r=>`
    <div class="data-row">
      <div class="lane-badge l${r.lane}">${r.lane}</div>
      <div class="data-name">${escapeHtml(r.name)}</div>
      <div class="data-num">${r.exh}</div>
      <div class="data-num">${r.natWin}</div>
      <div class="data-num">${r.localWin}</div>
      <div class="data-num">${r.motor2r ?? "-"}</div>
    </div>
  `).join("");
  wrap.innerHTML = head + rows;
}

loadRealData();
