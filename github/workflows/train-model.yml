name: Train ML model

on:
  workflow_dispatch:
    inputs:
      min_races:
        description: "学習に必要な最低レース数(これ未満なら安全に中止)"
        required: false
        default: "300"

permissions:
  contents: write  # model.txt をコミットするために必要

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: 特徴量を作成
        run: |
          python data-collection/build_features.py \
            --db data-collection/boatrace.db \
            --out data-collection/features.csv

      - name: モデルを学習
        run: |
          python data-collection/train_model.py \
            --features data-collection/features.csv \
            --out data-collection/model.txt \
            --min-races ${{ github.event.inputs.min_races }}

      - name: モデルをコミットしてpush
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-collection/model.txt
          git diff --cached --quiet || git commit -m "MLモデルを学習・更新"
          git push
