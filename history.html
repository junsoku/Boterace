<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>予想の履歴 | 競艇予想</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0E2436;
    --navy-soft:#16324A;
    --paper:#EEF1EF;
    --card:#FFFFFF;
    --line:#D8DEDC;
    --ink:#16232B;
    --ink-soft:#5B6B72;
    --accent:#16786B;
    --accent-soft:#E4F1EE;
    --miss:#B3261E;
    --miss-soft:#FCE8E6;
    --lane1:#FFFFFF; --lane1-line:#26313A;
    --lane2:#1A1A1A;
    --lane3:#D2352C;
    --lane4:#1D63B4;
    --lane5:#F2B705;
    --lane6:#2E8B4E;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
    padding-bottom:44px;
  }

  .appbar{
    background:var(--navy);
    color:#fff;
    padding:16px 18px;
    display:flex;
    align-items:center;
    gap:12px;
    position:sticky; top:0; z-index:10;
  }
  .back{
    font-size:22px;
    color:#CBD9DE;
    line-height:1;
    background:none;
    border:none;
    padding:0;
    font-family:inherit;
    -webkit-tap-highlight-color:transparent;
  }
  .appbar-title{
    font-family:'Shippori Mincho', serif;
    font-size:19px;
    font-weight:700;
  }
  .appbar-sub{
    font-size:12px;
    color:#8FA6B2;
    margin-top:2px;
  }

  .summary-bar{
    display:flex;
    gap:10px;
    padding:16px;
  }
  .summary-card{
    flex:1;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 10px;
    text-align:center;
  }
  .summary-num{
    font-family:'Shippori Mincho', serif;
    font-size:22px;
    font-weight:700;
    color:var(--navy);
  }
  .summary-label{
    font-size:10.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .summary-extra{
    padding:0 16px 4px;
    font-size:11.5px;
    color:var(--ink-soft);
    text-align:center;
  }

  .period-switch{
    display:flex;
    gap:6px;
    padding:0 16px 12px;
    overflow-x:auto;
    -ms-overflow-style:none; scrollbar-width:none;
  }
  .period-switch::-webkit-scrollbar{ display:none; }
  .period-btn{
    flex:0 0 auto;
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-soft);
    border-radius:16px;
    padding:6px 14px;
    font-size:12px;
    font-weight:700;
    font-family:inherit;
    white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .period-btn.active{
    background:var(--navy);
    border-color:var(--navy);
    color:#fff;
  }

  .date-header{
    padding:14px 18px 6px;
    font-size:13px;
    font-weight:700;
    color:var(--ink-soft);
  }

  .race-list{
    padding:0 14px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .race-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .race-card-head{
    display:flex;
    flex-wrap:wrap;
    justify-content:space-between;
    align-items:center;
    gap:6px;
    margin-bottom:8px;
  }
  .race-card-title{
    font-size:13px;
    font-weight:700;
    color:var(--navy);
  }
  .badge-group{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    margin-left:auto;
  }
  .hit-badge{
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:10px;
    white-space:nowrap;
  }
  .hit-badge.hit{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .hit-badge.miss{
    background:var(--miss-soft);
    color:var(--miss);
  }
  .hit-badge.partial{
    background:#FFF3D6;
    color:#8A6100;
  }

  .compare-row{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .compare-side{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .compare-label{
    font-size:10px;
    color:var(--ink-soft);
    width:34px;
    flex:0 0 auto;
  }
  .lane-badge{
    width:24px; height:24px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:700;
    flex:0 0 auto;
  }
  .lane-badge.l1{ background:var(--lane1); color:#16232B; border:1.5px solid var(--lane1-line); }
  .lane-badge.l2{ background:var(--lane2); color:#fff; }
  .lane-badge.l3{ background:var(--lane3); color:#fff; }
  .lane-badge.l4{ background:var(--lane4); color:#fff; }
  .lane-badge.l5{ background:var(--lane5); color:#3A2E00; }
  .lane-badge.l6{ background:var(--lane6); color:#fff; }
  .compare-name{
    font-size:12.5px;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .compare-arrow{
    color:var(--ink-soft);
    font-size:14px;
    flex:0 0 auto;
  }

  .trifecta-note{
    margin-top:8px;
    font-size:10.5px;
    color:var(--ink-soft);
  }
  .bet-compare{
    margin-top:10px;
    padding-top:10px;
    border-top:1px dashed var(--line);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .bet-combo-box{
    flex:1;
    text-align:center;
  }
  .bet-combo-label{
    font-size:10px;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .bet-combo-num{
    font-family:'Shippori Mincho', serif;
    font-size:17px;
    font-weight:700;
    letter-spacing:.02em;
  }
  .bet-combo-num.hit{ color:var(--accent); }
  .bet-combo-num.miss{ color:var(--ink); }
  .bet-payout{
    font-size:10px;
    color:var(--accent);
    font-weight:700;
    margin-top:2px;
  }

  /* ---- 他の候補(表示する/閉じる) ---- */
  .toggle-others{
    margin-top:8px;
    width:100%;
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    padding:6px 0;
    font-family:inherit;
    font-size:11px;
    font-weight:700;
    color:var(--navy-soft);
    -webkit-tap-highlight-color:transparent;
  }
  .toggle-others:active{
    background:#F2F4F3;
  }
  .other-combos{
    display:none;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }
  .other-combos.open{
    display:block;
  }
  .other-combo-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:5px 2px;
    font-size:12px;
  }
  .other-combo-rank{
    color:var(--ink-soft);
    width:20px;
    flex:0 0 auto;
  }
  .other-combo-num{
    font-family:'Shippori Mincho', serif;
    font-size:14px;
    font-weight:700;
    flex:1;
  }
  .other-combo-num.hit{ color:var(--accent); }
  .other-combo-prob{
    color:var(--ink-soft);
    font-size:11px;
    flex:0 0 auto;
  }
  .other-combo-hit-tag{
    font-size:10px;
    font-weight:700;
    color:var(--accent);
    background:var(--accent-soft);
    padding:1px 6px;
    border-radius:8px;
    margin-left:6px;
    flex:0 0 auto;
  }
  .other-combos-empty{
    font-size:11px;
    color:var(--ink-soft);
    text-align:center;
    padding:4px 0;
  }

  .empty-note{
    padding:60px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    line-height:1.7;
  }
  .loading-note{
    padding:40px 24px;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
  }

  .data-note{
    margin:20px 16px 0;
    padding:12px 14px;
    background:#FFF6E0;
    border:1px solid #F0DFA6;
    border-radius:8px;
    font-size:11.5px;
    color:#6B5410;
    line-height:1.7;
  }
</style>
</head>
<body>

  <div class="appbar">
    <button class="back" onclick="location.href='index.html'">‹</button>
    <div>
      <div class="appbar-title">予想の履歴</div>
      <div class="appbar-sub" id="periodLabel">直近14日間</div>
    </div>
  </div>

  <div class="summary-bar">
    <div class="summary-card">
      <div class="summary-num" id="evaluatedNum">-</div>
      <div class="summary-label">検証レース数</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="winHitNum">-</div>
      <div class="summary-label">◎単勝的中率</div>
    </div>
    <div class="summary-card">
      <div class="summary-num" id="recoveryNum">-</div>
      <div class="summary-label">3連単回収率(本命1点)</div>
    </div>
  </div>
  <div class="summary-extra" id="summaryExtra"></div>

  <div class="period-switch" id="periodSwitch"></div>

  <div id="listArea"><div class="loading-note">読み込み中...</div></div>

  <div class="data-note">
    表示している予想は、実際にその時点で計算されアプリに表示されていたものを記録した実履歴です(後から作り直した参考値ではありません)。ただし記録の仕組みを導入した時点より前のレースは含まれません。
  </div>

<script>
function escapeHtml(str){
  if (str === null || str === undefined) return "";
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const MOCK_DATA = {
  generatedAt: "2026-09-09",
  periodStart: "2026-08-26",
  periodEnd: "2026-09-09",
  summary: { evaluated: 42, winHitRate: 0.52, betHitRate: 0.11, betHitRateAll: 0.34, recoveryRate: 0.78, recoveryRateAll: 0.86 },
  races: [
    {date:"2026-09-08", stadium:"桐生", raceNumber:3, grade:null,
     predictedTop:{lane:1,name:"田中 一輝",pct:34}, actualWinner:{lane:1,name:"田中 一輝"},
     predictedBetCombo:"1-4-2",
     predictedBetCombos:[
       {combo:"1-4-2", prob:"9.8%", hit:true},
       {combo:"1-2-4", prob:"7.1%", hit:false},
       {combo:"1-4-3", prob:"5.9%", hit:false},
       {combo:"4-1-2", prob:"4.2%", hit:false},
     ],
     winHit:true, betHit:true, actualCombo:"1-4-2", actualPayout:1520},
    {date:"2026-09-08", stadium:"戸田", raceNumber:7, grade:"G1",
     predictedTop:{lane:2,name:"鈴木 亮太",pct:28}, actualWinner:{lane:4,name:"渡辺 翔"},
     predictedBetCombo:"2-1-4",
     predictedBetCombos:[
       {combo:"2-1-4", prob:"8.3%", hit:false},
       {combo:"2-4-1", prob:"6.5%", hit:false},
       {combo:"1-2-4", prob:"5.7%", hit:false},
       {combo:"4-1-3", prob:"4.9%", hit:true},
     ],
     winHit:false, betHit:false, actualCombo:"4-1-3", actualPayout:null},
  ]
};

let RAW_DATA = MOCK_DATA;
let activePeriodDays = 14; // null は「全期間」

const PERIOD_OPTIONS = [
  {label:"7日間", days:7},
  {label:"14日間", days:14},
  {label:"30日間", days:30},
  {label:"90日間", days:90},
  {label:"全期間", days:null},
];

function filterRacesByPeriod(races, days){
  if (days === null) return races;
  // races は日付の新しい順に並んでいる前提。先頭(最新)の日付を基準に days 日さかのぼる。
  if (races.length === 0) return races;
  const latest = new Date(races[0].date);
  const threshold = new Date(latest);
  threshold.setDate(threshold.getDate() - (days - 1));
  return races.filter(r => new Date(r.date) >= threshold);
}

// サーバー(export_history.py)が出力したサマリーは、その時にエクスポートした期間全体のもの。
// 期間を切り替えたら、絞り込んだレース一覧から同じロジックでサマリーを再計算する。
function recomputeSummary(races){
  let evaluated = 0, winHits = 0, betHits = 0, betHitsAll = 0;
  let stake = 0, payoutReturn = 0, stakeAll = 0, payoutReturnAll = 0;
  for (const race of races){
    evaluated++;
    if (race.winHit) winHits++;
    if (race.betHit) betHits++;
    const combos = Array.isArray(race.predictedBetCombos) && race.predictedBetCombos.length
      ? race.predictedBetCombos : [{hit: race.betHit}];
    if (combos.some(c => c.hit)) betHitsAll++;
    if (race.actualPayout !== null && race.actualPayout !== undefined){
      stake += 100;
      if (race.betHit) payoutReturn += race.actualPayout;
      stakeAll += 100 * combos.length;
      if (combos.some(c => c.hit)) payoutReturnAll += race.actualPayout;
    }
  }
  return {
    evaluated,
    winHitRate: evaluated ? winHits / evaluated : null,
    betHitRate: evaluated ? betHits / evaluated : null,
    betHitRateAll: evaluated ? betHitsAll / evaluated : null,
    recoveryRate: stake ? payoutReturn / stake : null,
    stake, payoutReturn,
    recoveryRateAll: stakeAll ? payoutReturnAll / stakeAll : null,
    stakeAll, payoutReturnAll,
  };
}

function renderPeriodSwitch(){
  const wrap = document.getElementById("periodSwitch");
  wrap.innerHTML = "";
  PERIOD_OPTIONS.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "period-btn" + (opt.days === activePeriodDays ? " active" : "");
    btn.textContent = opt.label;
    btn.onclick = ()=>{
      activePeriodDays = opt.days;
      applyPeriod();
    };
    wrap.appendChild(btn);
  });
}

function applyPeriod(){
  const races = filterRacesByPeriod(RAW_DATA.races || [], activePeriodDays);
  const summary = recomputeSummary(races);
  const periodStart = races.length ? races[races.length - 1].date : RAW_DATA.periodStart;
  const periodEnd = races.length ? races[0].date : RAW_DATA.periodEnd;
  renderPeriodSwitch();
  renderSummary({ periodStart, periodEnd, summary });
  renderList({ races });
}

function fmtPct(v){
  return v === null || v === undefined ? "-" : Math.round(v * 1000) / 10 + "%";
}
function fmtYen(v){
  return v === null || v === undefined ? "-" : v.toLocaleString() + "円";
}

function renderSummary(data){
  document.getElementById("periodLabel").textContent = `${data.periodStart} 〜 ${data.periodEnd}`;
  document.getElementById("evaluatedNum").textContent = data.summary.evaluated;
  document.getElementById("winHitNum").textContent = fmtPct(data.summary.winHitRate);
  document.getElementById("recoveryNum").textContent = fmtPct(data.summary.recoveryRate);
  const lines = [`本命3連単的中率 ${fmtPct(data.summary.betHitRate)}`];
  if (data.summary.betHitRateAll !== null && data.summary.betHitRateAll !== undefined){
    lines.push(`推奨3連単的中率(候補4点のいずれか) ${fmtPct(data.summary.betHitRateAll)}`);
  }
  if (data.summary.recoveryRateAll !== null && data.summary.recoveryRateAll !== undefined){
    const stakeAll = data.summary.stakeAll;
    const returnAll = data.summary.payoutReturnAll;
    lines.push(`候補4点均等買いの回収率 ${fmtPct(data.summary.recoveryRateAll)}(賭け金${fmtYen(stakeAll)} / 払戻${fmtYen(returnAll)})`);
  }
  document.getElementById("summaryExtra").innerHTML = lines.map(l => escapeHtml(l)).join("<br>");
}

function toggleOthers(btn){
  const panel = btn.nextElementSibling;
  const open = panel.classList.toggle("open");
  btn.textContent = open ? "閉じる ▲" : "他の候補も表示する ▼";
}

function renderOtherCombos(race){
  // predictedBetCombos は本命(1位)を含む配列。2位以降だけを「他の候補」として出す。
  const combos = Array.isArray(race.predictedBetCombos) ? race.predictedBetCombos : [];
  const others = combos.slice(1);
  if (others.length === 0){
    return `<div class="other-combos-empty">この記録には他候補のデータがありません(機能追加前のレースのため)</div>`;
  }
  return others.map((c, i) => `
    <div class="other-combo-row">
      <div class="other-combo-rank">${i + 2}位</div>
      <div class="other-combo-num ${c.hit ? "hit" : ""}">${escapeHtml(c.combo)}</div>
      <div class="other-combo-prob">${escapeHtml(c.prob || "-")}</div>
      ${c.hit ? `<div class="other-combo-hit-tag">的中</div>` : ""}
    </div>
  `).join("");
}

// 推奨3連単の的中状況を3段階で判定する。
// 本命(1位候補)が当たった/本命は外れたが2〜4位のどれかが当たった/4点とも外れた、の3パターン。
function betStatus(race){
  const combos = Array.isArray(race.predictedBetCombos) && race.predictedBetCombos.length
    ? race.predictedBetCombos : [{hit: race.betHit}];
  if (combos[0] && combos[0].hit) return {cls:"hit", label:"本命3連単的中"};
  if (combos.some(c => c.hit)) return {cls:"partial", label:"推奨3連単的中"};
  return {cls:"miss", label:"3連単不的中"};
}

function renderList(data){
  const area = document.getElementById("listArea");
  if (!data.races || data.races.length === 0){
    area.innerHTML = `<div class="empty-note">まだ検証できるレースがありません。<br>結果データが溜まるとここに表示されます。</div>`;
    return;
  }

  let html = "";
  let lastDate = null;
  for (const race of data.races){
    if (race.date !== lastDate){
      html += `<div class="date-header">${escapeHtml(race.date)}</div>`;
      lastDate = race.date;
    }
    const hasOthers = Array.isArray(race.predictedBetCombos) && race.predictedBetCombos.length > 1;
    const bet = betStatus(race);
    html += `<div class="race-list"><div class="race-card">
      <div class="race-card-head">
        <div class="race-card-title">${escapeHtml(race.stadium)} ${race.raceNumber}R${race.grade ? " ・ " + escapeHtml(race.grade) : ""}</div>
        <div class="badge-group">
          <div class="hit-badge ${race.winHit ? "hit" : "miss"}">${race.winHit ? "◎単勝 的中" : "◎単勝 不的中"}</div>
          <div class="hit-badge ${bet.cls}">${bet.label}</div>
        </div>
      </div>
      <div class="compare-row">
        <div class="compare-side">
          <div class="compare-label">予想◎</div>
          <div class="lane-badge l${race.predictedTop.lane}">${race.predictedTop.lane}</div>
          <div class="compare-name">${escapeHtml(race.predictedTop.name)}</div>
        </div>
        <div class="compare-arrow">→</div>
        <div class="compare-side">
          <div class="compare-label">実際1着</div>
          <div class="lane-badge l${race.actualWinner.lane}">${race.actualWinner.lane}</div>
          <div class="compare-name">${escapeHtml(race.actualWinner.name)}</div>
        </div>
      </div>
      <div class="bet-compare">
        <div class="bet-combo-box">
          <div class="bet-combo-label">推奨3連単(本命)</div>
          <div class="bet-combo-num ${race.betHit ? "hit" : "miss"}">${escapeHtml(race.predictedBetCombo || "-")}</div>
        </div>
        <div class="compare-arrow">${race.betHit ? "=" : "→"}</div>
        <div class="bet-combo-box">
          <div class="bet-combo-label">実際1〜3着</div>
          <div class="bet-combo-num ${race.betHit ? "hit" : "miss"}">${escapeHtml(race.actualCombo)}</div>
          ${race.actualPayout ? `<div class="bet-payout">払戻 ${race.actualPayout.toLocaleString()}円</div>` : ""}
        </div>
      </div>
      ${hasOthers ? `
      <button class="toggle-others" onclick="toggleOthers(this)">他の候補も表示する ▼</button>
      <div class="other-combos">
        ${renderOtherCombos(race)}
      </div>` : ""}
    </div></div>`;
  }
  area.innerHTML = html;
}

async function loadData(){
  let data = MOCK_DATA;
  try{
    const res = await fetch("./data/history.json", {cache:"no-store"});
    if(!res.ok) throw new Error("no data file");
    const json = await res.json();
    if(json.races) data = json;
  }catch(e){
    // 取得できない場合はサンプルデータのまま表示
  }
  RAW_DATA = data;
  applyPeriod();
}

loadData();
</script>

</body>
</html>
