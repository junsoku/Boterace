name: Analyze EV patterns

on:
  workflow_dispatch:  # 手動実行のみ(読み取り専用の分析)

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: EVパターンを分析
        run: |
          python data-collection/analyze_ev_patterns.py \
            --db data-collection/boatrace.db
        # git commit/pushは一切しない(読み取り専用の分析)
