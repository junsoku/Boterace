name: Analyze tier accuracy

on:
  workflow_dispatch:
    inputs:
      since:
        description: "この日付(YYYY-MM-DD)以降のレースだけを対象にする(空欄なら全期間)"
        required: false
        default: ""
      periods:
        description: "期間をいくつに分けるか(既定3=初期/中期/直近。sinceで絞る時は1がおすすめ)"
        required: false
        default: "3"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: ティア別の的中率・回収率を検証
        run: |
          SINCE_ARG=""
          if [ -n "${{ github.event.inputs.since }}" ]; then
            SINCE_ARG="--since ${{ github.event.inputs.since }}"
          fi
          python data-collection/analyze_tier_accuracy.py \
            --db data-collection/boatrace.db \
            --periods ${{ github.event.inputs.periods }} \
            $SINCE_ARG
        # git commit/pushは一切しない(読み取り専用の分析)
