name: Update boatrace data

on:
  schedule:
    # scheduleトリガー(cron)はGitHub側で優先度が低く、混雑時は実行自体がスキップされることが
    # 多発していた(実測で数時間おきにしか動かない日があった)。そのため、この30分おきの
    # 更新そのものはこのワークフロー自身がworkflow_dispatch経由で自分を再起動する「自己連鎖」で
    # 行う(下の「次回実行を予約」ステップ参照)。workflow_dispatchはAPI直接呼び出しのため、
    # scheduleほど優先度が下がらない。
    # ここでのscheduleは、連鎖が何らかの理由で途切れた場合に自動復旧させるための「保険」として、
    # 2時間おきの低頻度にしている(保険なので、多少遅延・スキップされても実害は小さい)。
    - cron: "15 23 * * *"              # JST 8:15(その日最初の起点)
    - cron: "15 1,3,5,7,9,11,13 * * *" # JST 10:15,12:15,14:15,16:15,18:15,20:15,22:15(保険)
  workflow_dispatch: {}  # Actionsタブから手動実行、および自己連鎖からの呼び出しの両方に使う

# 保険のscheduleと自己連鎖が重なって同時に2つ動いてしまわないよう、同じグループ名で直列化する
# (cancel-in-progress: falseなので、先に動いている方を待ってから後発が実行される。キャンセルはしない)。
concurrency:
  group: update-data-chain
  cancel-in-progress: false

permissions:
  contents: write  # boatrace.db / data/today.json をコミットし直すために必要
  actions: write   # 自分自身をworkflow_dispatchで再起動するために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: 日本時間の日付を計算
        id: dates
        run: |
          echo "today=$(TZ='Asia/Tokyo' date +%F)" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(TZ='Asia/Tokyo' date -d '-1 day' +%F)" >> "$GITHUB_OUTPUT"

      - name: 前日の結果 + 当日の出走表を取得
        run: |
          python data-collection/ingest.py \
            --start ${{ steps.dates.outputs.yesterday }} \
            --end ${{ steps.dates.outputs.today }} \
            --db data-collection/boatrace.db

      - name: 当日の予想JSONを生成
        run: |
          MODEL_ARG=""
          if [ -f data-collection/model.txt ]; then
            MODEL_ARG="--model data-collection/model.txt"
          fi
          python data-collection/export_today.py \
            --db data-collection/boatrace.db \
            --date ${{ steps.dates.outputs.today }} \
            --out data/today.json \
            $MODEL_ARG
        # レース信頼度ティア(A〜D)の閾値は data-collection/tier_thresholds.json に
        # 1日1回だけ計算してキャッシュされる(get_daily_tier_thresholds参照)。
        # 下のcommitステップで一緒にpushしないと、次回実行時に引き継がれず
        # 毎回再計算されてしまう(=判定がブレる)ため、必ずgit addに含めること。

      - name: 履歴JSONを生成
        run: |
          python data-collection/export_history.py \
            --db data-collection/boatrace.db \
            --days 90 \
            --limit 15000 \
            --out data/history.json
        # history.html側に7/14/30/90日間・全期間の切り替えUIがあるため、
        # 90日分を出力しておく(export_history.pyのデフォルトと合わせている)。
        # 1日あたり100レース超あるため、90日をカバーするには limit も
        # それに応じて大きくしておく必要がある(15000 = 余裕を持った上限)。

      - name: 変更をコミットしてpush(Pagesに反映される)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-collection/boatrace.db data-collection/tier_thresholds.json data/today.json data/history.json
          git diff --cached --quiet || git commit -m "データ更新: ${{ steps.dates.outputs.today }}"
          git push

      - name: 次回実行を予約(自己連鎖)
        run: |
          # 約28分待機してから自分自身をworkflow_dispatchで起動し直す。
          # (ここまでの処理に数分かかるため、合計でだいたい30分間隔になる。
          # 厳密な時刻合わせはしない。scheduleと違ってworkflow_dispatchは
          # キリの良い時刻を避ける必要が無いため。)
          sleep 1680

          HOUR_AFTER=$(TZ='Asia/Tokyo' date +%H)
          # 日本時間8〜22時台のみ連鎖を続ける。夜間(23〜翌7時台)は止めて、
          # 翌朝8:15の保険scheduleに起動を任せる。
          if [ "$HOUR_AFTER" -ge 8 ] && [ "$HOUR_AFTER" -le 22 ]; then
            echo "次回実行を予約します(現在JST ${HOUR_AFTER}時台)"
            curl -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/update-data.yml/dispatches" \
              -d '{"ref":"${{ github.ref_name }}"}'
          else
            echo "夜間帯(JST ${HOUR_AFTER}時台)のため連鎖を止めます。翌朝の保険scheduleで再開します。"
          fi
