name: Update boatrace data

on:
  schedule:
    # 日本時間 7:00〜22:30 の間、30分おきに実行(UTCでは前日22時〜当日13:30に相当)。
    # 展示タイムはレース締切の直前にしか確定しないため、頻繁に取得しないと反映されない。
    # レースが行われない深夜早朝は無駄なので対象外にしている。
    - cron: "*/30 22-23 * * *"  # UTC 22:00-23:59 = JST 翌7:00-8:59
    - cron: "*/30 0-13 * * *"   # UTC 0:00-13:30  = JST 9:00-22:30
  workflow_dispatch: {}  # Actionsタブから手動実行もできるようにする

permissions:
  contents: write  # boatrace.db / data/today.json をコミットし直すために必要

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: 日本時間の日付を計算
        id: dates
        run: |
          echo "today=$(TZ='Asia/Tokyo' date +%F)" >> "$GITHUB_OUTPUT"
          echo "yesterday=$(TZ='Asia/Tokyo' date -d '-1 day' +%F)" >> "$GITHUB_OUTPUT"

      - name: 前日の結果 + 当日の出走表を取得
        run: |
          python data-collection/ingest.py \
            --start ${{ steps.dates.outputs.yesterday }} \
            --end ${{ steps.dates.outputs.today }} \
            --db data-collection/boatrace.db

      - name: 当日の予想JSONを生成
        run: |
          MODEL_ARG=""
          if [ -f data-collection/model.txt ]; then
            MODEL_ARG="--model data-collection/model.txt"
          fi
          python data-collection/export_today.py \
            --db data-collection/boatrace.db \
            --date ${{ steps.dates.outputs.today }} \
            --out data/today.json \
            $MODEL_ARG

      - name: 履歴JSONを生成
        run: |
          python data-collection/export_history.py \
            --db data-collection/boatrace.db \
            --days 14 \
            --out data/history.json

      - name: 変更をコミットしてpush(Pagesに反映される)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-collection/boatrace.db data/today.json data/history.json
          git diff --cached --quiet || git commit -m "データ更新: ${{ steps.dates.outputs.today }}"
          git push
