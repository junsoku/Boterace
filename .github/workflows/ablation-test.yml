name: Ablation test (boat_number)

on:
  workflow_dispatch:  # 手動実行のみ。自動スケジュールはしない(使い捨ての実験のため)

jobs:
  ablation:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: 特徴量を作成
        run: |
          python data-collection/build_features.py \
            --db data-collection/boatrace.db \
            --out data-collection/features.csv

      - name: boat_numberあり/なしを比較
        run: |
          python data-collection/ablation_test.py \
            --features data-collection/features.csv
        # このジョブはgit commit/pushを一切しない(モデルにもリポジトリにも影響しない使い捨て実験)
