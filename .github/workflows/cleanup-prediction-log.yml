name: Cleanup prediction_log

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "実際に削除する場合はtrueを指定(既定falseは確認のみで削除しない)"
        required: false
        default: "false"

permissions:
  contents: write  # 削除を実行する場合、boatrace.dbをコミットし直すために必要

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: prediction_logを掃除
        run: |
          EXECUTE_ARG=""
          if [ "${{ github.event.inputs.execute }}" = "true" ]; then
            EXECUTE_ARG="--execute"
          fi
          python data-collection/cleanup_prediction_log.py \
            --db data-collection/boatrace.db \
            $EXECUTE_ARG

      - name: 変更をコミットしてpush(実削除した場合のみ)
        if: ${{ github.event.inputs.execute == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data-collection/boatrace.db
          git diff --cached --quiet || git commit -m "prediction_logの重複スナップショットを削除"
          git push
