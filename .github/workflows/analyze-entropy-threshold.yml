name: Analyze entropy threshold

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "検証したい格下げ閾値(既定: confidence.pyの現在値0.85)"
        required: false
        default: "0.85"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python環境をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 依存パッケージをインストール
        run: pip install -r data-collection/requirements.txt

      - name: エントロピー格下げ閾値を検証
        run: |
          python data-collection/analyze_entropy_threshold.py \
            --db data-collection/boatrace.db \
            --threshold ${{ github.event.inputs.threshold }}
        # git commit/pushは一切しない(読み取り専用の分析)
